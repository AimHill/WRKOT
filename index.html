/* ================= swap for today ================= */
function swapSheet(id){
 const date=S.ui.logDate||todayISO();const s=ensureSession(date);const base=dayOf(s.day).ex.find(z=>z.id===id);if(!base)return;const cur=effEx(base,s);
 const score=e=>e.prim.filter(m=>base.prim.includes(m)).length*2+e.prim.filter(m=>base.sec.includes(m)).length*.5+e.sec.filter(m=>base.prim.includes(m)).length*.5;
 const row=e=>`<button class="lib-row" data-swap="${esc(e.name)}"><div class="ex-fig" style="">${miniFocus(e.prim,e.sec)}</div><div class="grow"><div style="font-weight:650">${esc(e.name)}</div><div class="dim" style="font-size:12.5px">${e.prim.map(mName).join(', ')}</div></div>${IC.swap.replace('<svg','<svg style="width:18px;height:18px;color:var(--accT)"')}</button>`;
 const list=q=>{q=q.trim().toLowerCase();let r=LIB.filter(e=>e.name!==cur.name);if(q)r=r.filter(e=>e.name.toLowerCase().includes(q)||e.prim.some(m=>mName(m).toLowerCase().includes(q)));else r=r.filter(e=>score(e)>=2).sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name));
  let h='';if(cur.swappedFrom&&!q)h+=`<button class="lib-row" data-swap="__undo"><div class="ex-fig" style="">${miniFocus(base.prim,base.sec)}</div><div class="grow"><div style="font-weight:700">Back to ${esc(base.name)}</div><div class="dim" style="font-size:12.5px">Undo today’s swap</div></div></button>`;
  h+=r.slice(0,40).map(row).join('');return h||'<div class="empty-note" style="padding:16px">No matches</div>';};
 openSheet('Swap for today',`<p class="muted" style="font-size:13px;margin:-6px 0 12px">Replaces <b style="color:var(--t1)">${esc(cur.name)}</b> in today’s log only. Your plan doesn’t change.</p><input class="inp" id="swQ" placeholder="Search exercises or muscles" autocomplete="off"><div id="swL" style="margin-top:6px">${list('')}</div>`,sh=>{
  const L=$('#swL',sh),Q=$('#swQ',sh);Q.oninput=()=>{L.innerHTML=list(Q.value);};
  L.onclick=e=>{const b=e.target.closest('[data-swap]');if(b)doSwap(id,b.dataset.swap);};
 });
}
async function doSwap(id,name){
 const date=S.ui.logDate||todayISO();const s=ensureSession(date);const e=s.ex[id];
 if(e&&(e.sets||[]).some(x=>+x.r>0)){const ok=await confirmSheet('Clear today’s sets?',`You already logged sets for <b>${esc(e.name)}</b> today. Swapping clears them.`,'Swap anyway',true);if(!ok)return;}
 snapshot();delete s.ex[id];s.swaps=s.swaps||{};
 if(name==='__undo')delete s.swaps[id];else{const L=LIB.find(z=>z.name===name);if(!L)return;s.swaps[id]={name:L.name,prim:[...L.prim],sec:[...L.sec]};}

/* ================= plates & warm-up ================= */
const isBarbell=n=>/barbell|military press|romanian deadlift|^deadlift|ez-bar|bench press|front squat/i.test(n)&&!/db |dumbbell/i.test(n);
const PLATE={lb:{45:['#4C8DFF',110],35:['#FFC845',98],25:['#3CE58A',86],10:['#E6E6EB',64],5:['#FF6B5E',52],2.5:['#B4B4BC',42]},kg:{25:['#FF6B5E',110],20:['#4C8DFF',106],15:['#FFC845',94],10:['#3CE58A',82],5:['#E6E6EB',58],2.5:['#B4B4BC',46],1.25:['#B4B4BC',38]}};
function loadOut(target,bar,plates){const per=(target-bar)/2;if(!(per>0))return{per:[],total:bar};let rem=per+1e-9;const out=[];[...plates].sort((a,b)=>b-a).forEach(p=>{while(rem>=p-1e-9){out.push(p);rem-=p;}});return{per:out,total:bar+2*out.reduce((a,b)=>a+b,0)};}
function platesSheet(id){
 const date=S.ui.logDate||todayISO();const x=logList(date).find(z=>z.id===id);if(!x)return;const s=S.sessions[date];const e=s&&s.ex[id];const u=unit();const bb=isBarbell(x.name);
 const last=lastBefore(x.name,date);let target=(e&&(e.sets.map(z=>+z.w).find(v=>v>0)))||(last&&last.top.w)||'';
 S.settings.bar=S.settings.bar||{lb:45,kg:20};let bar=/ez-bar/i.test(x.name)?(u==='lb'?25:10):(S.settings.bar[u]||(u==='lb'?45:20));
 const all=Object.keys(PLATE[u]).map(Number).sort((a,b)=>b-a);
 const own=()=>{const o=(S.settings.plates&&S.settings.plates[u])||all;return o.length?o:all;};
 const paint=sh=>{
  const T=parseFloat($('#plT',sh).value)||0;let h='';const O=own();
  if(bb){const Lo=loadOut(T,bar,O);
   h+=`<div class="barviz"><div class="shaft"></div><div class="collar"></div>${Lo.per.map(p=>`<div class="plate" style="height:${PLATE[u][p][1]}px;background:${PLATE[u][p][0]}">${p}</div>`).join('')}<div class="sleeve"></div></div>`;
   h+=`<div class="row sb" style="margin-bottom:4px"><div><div class="card-t">${Lo.per.length?Lo.per.join(' + '):'Empty bar'}</div><div class="card-s">${Lo.per.length?'on each side':'no plates needed'}</div></div><div style="text-align:right"><div class="card-t num">${fmtNum(Lo.total)} ${u}</div><div class="card-s">${T>bar&&Math.abs(Lo.total-T)>.01?'closest you can load':'on the bar'}</div></div></div>`;}
  let wrows=[];if(T>0){
   const inc=u==='lb'?5:2.5;const steps=bb?[[0,10,'Bar'],[.4,8],[.6,5],[.8,3]]:[[.5,10],[.75,5]];const seen=new Set();const rows=[];
   steps.forEach(([pc,reps,label])=>{let w=pc?T*pc:bar;let ps=null;if(bb){const Lo=loadOut(Math.max(w,bar),bar,O);w=Lo.total;ps=Lo.per;}else w=Math.max(inc,Math.round(w/inc)*inc);if(w>=T-1e-9||seen.has(w))return;seen.add(w);rows.push({w,reps,label:label||Math.round(pc*100)+'%',ps});});wrows=rows;
   const work=bb?loadOut(T,bar,O).total:T;
   h+=`<div class="sec-t" style="margin-top:16px">Warm-up</div><div class="card" style="background:var(--s2);padding:2px 14px;margin-bottom:8px">${rows.map(r=>`<div class="wu"><span class="dim" style="font-weight:700">${r.label}</span><span><b class="num">${fmtNum(r.w)}</b> <span class="dim">${u} × ${r.reps}</span></span><span class="ps">${r.ps?(r.ps.length?r.ps.join(' + '):'bar only'):''}</span></div>`).join('')}<div class="wu"><span style="font-weight:750;color:var(--accT)">Work</span><span><b class="num">${fmtNum(work)}</b> <span class="dim">${u} × ${esc(x.reps)}</span></span><span class="ps">${bb?(loadOut(T,bar,O).per.join(' + ')||'bar only'):''}</span></div></div><p class="dim" style="font-size:12px">About a minute between warm-ups. They should feel easy.</p>${rows.length?'<button class="btn btn-ghost btn-block btn-sm" style="margin-top:10px" id="plAddWu">Add these warm-ups to the log</button>':''}`;
  }else h+=`<div class="empty-note" style="margin:16px 0 4px">${/push-up|ring|v-ups|l-sit|pike|hamstring curl/i.test(x.name)?'Bodyweight lift — do one easy set of 5–8 reps first.':'Type your working weight to see '+(bb?'plates and ':'')+'warm-up sets.'}</div>`;
  $('#plOut',sh).innerHTML=h;const wb=$('#plAddWu',sh);if(wb)wb.onclick=()=>addWarmups(id,wrows.map(r=>({w:r.w,r:r.reps})));
 };
 openSheet(bb?'Plates & warm-up':'Warm-up',`<div class="dim" style="text-align:center;font-size:12.5px;font-weight:650;margin:-4px 0 6px">${esc(x.name)} · working weight</div><div class="big-inp"><input id="plT" class="num" inputmode="decimal" value="${target?fmtNum(+target):''}" placeholder="0"><span>${u}</span></div>
  ${bb?`<div class="field" style="margin-top:14px"><span>Bar</span><div class="seg" id="plBar">${(u==='lb'?[45,35,25,15]:[20,15,10]).map(b=>`<button data-b="${b}" class="${b===bar?'on':''}">${b} ${u}</button>`).join('')}</div></div>`:''}
  <div id="plOut"></div>
  ${bb?`<div class="field" style="margin-top:14px"><span>Plates you own</span><div class="chips" id="plOwn">${all.map(p=>`<button class="chip tap ${own().includes(p)?'sel':''}" data-p="${p}">${p}</button>`).join('')}</div></div>`:''}`,sh=>{

  const P=$('#plOwn',sh);if(P)P.onclick=ev=>{const b=ev.target.closest('[data-p]');if(!b)return;const p=+b.dataset.p;S.settings.plates=S.settings.plates||{};let o=[...own()];o=o.includes(p)?o.filter(z=>z!==p):[...o,p];if(!o.length){toast('Keep at least one plate');return;}S.settings.plates[u]=o.sort((a,b)=>b-a);save();b.classList.toggle('sel');paint(sh);};
  paint(sh);
 });
}

function reachCount(L,date){let n=0;L.forEach(x=>{const a=aimOf(x,date);if(!a)return;const b=bestBefore(x.name,date);if(b>0&&e1rm(a.w||0,a.r)>b+1e-9)n++;});return n;}
